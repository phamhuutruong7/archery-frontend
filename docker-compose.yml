version: '3.8'

services:
  # Frontend Development Service
  archery-frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:5000
    networks:
      - archery-network
    command: npm run dev -- --host 0.0.0.0

  # Frontend Production Service
  archery-frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    networks:
      - archery-network
    profiles:
      - production

networks:
  archery-network:
    driver: bridge